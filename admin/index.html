<style>:root{--p:#5b2a86;--pd:#3d1a5c;--pl:#ede4f6;--bg:#f6f2fa;--bd:#e3d9ee;--neg:#c62828}*{box-sizing:border-box}

<script>
const $=id=>document.getElementById(id);let PW=sessionStorage.getItem('pw')||'';
const KINDS=[['appt','ไฟล์นัด','ต้องมีคอลัมน์: vn, lct, ส่งตรวจ, dct','ไม่ซ้ำตาม VN + lct + วันที่'],['walk','ไฟล์ Walk-in (w)','ต้องมีคอลัมน์: vn, lct, ส่งตรวจ','ไม่ซ้ำตาม VN + lct + วันที่'],['sched','ตารางนัดแพทย์','ต้องมีคอลัมน์: รหัสคลินิก, วันทำการ, รหัสแพทย์, รหัสเวลาทำการหลัก, รหัสเวลาทำการย่อย, จำนวนนัดย่อย','เลือกประเภทตารางต่อไฟล์ (นัดย่อย 1 ชม. / ไม่ใช่ 1 ชม.)']];
$('cards').innerHTML=KINDS.map(([k,n,c,d])=>`<div class="box"><h2>${n}</h2><div class="m">${c}<br>การนำเข้าเป็นการ <b>เพิ่ม</b> ต่อจากข้อมูลเดิม (${d})</div><div class="row"><input type="file" id="f_${k}" accept=".xls,.xlsx" multiple>${k=='sched'?'<select id="t_sched"><option value="1">นัดย่อย 1 ชม.</option><option value="0">ไม่ใช่ 1 ชม.</option></select>':''}<button id="i_${k}">นำเข้า</button><button class="d" id="x_${k}">ล้าง${n}</button></div><div class="log" id="l_${k}"></div></div>`).join('');
async function api(path,body){const r=await fetch('/api/admin/'+path,{method:body?'POST':'GET',headers:{'x-admin-password':PW,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
function show(m){const c=m.counts||{};['appt','walk','sched'].forEach(k=>$('c_'+k).textContent=(c[k]||0).toLocaleString());['appt','walk'].forEach(k=>$('r_'+k).textContent=m.range&&m.range[k]?m.range[k].join(' ถึง '):'');$('upd').textContent=m.updated?'อัปเดตล่าสุด '+new Date(m.updated).toLocaleString('th-TH'):''}
async function login(){try{PW=$('pw').value||PW;show(await api('status'));sessionStorage.setItem('pw',PW);$('app').hidden=false;$('lerr').textContent=''}catch(e){$('lerr').textContent=e.message}}
$('login').onclick=login;if(PW){login()}
function ymd(v){if(v==null||v==='')return null;const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/),y,mo,d;if(m){y=+m[1];mo=m[2];d=m[3]}else if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/)){y=+m[3];mo=m[2].padStart(2,'0');d=m[1].padStart(2,'0')}else return null;if(y>2400)y-=543;return y+'-'+mo+'-'+d}
const NEED={appt:['vn','lct','ส่งตรวจ','dct'],walk:['vn','lct','ส่งตรวจ'],sched:['รหัสคลินิก','วันทำการ','รหัสแพทย์','รหัสเวลาทำการหลัก','รหัสเวลาทำการย่อย','จำนวนนัดย่อย']};
function toRecords(k,rows,is1){const out=[];for(const r of rows){let x;
if(k=='sched'){if(r['รหัสคลินิก']==null)continue;x=[+r['รหัสคลินิก'],String(r['วันทำการ']).trim(),String(r['รหัสแพทย์']),+r['รหัสเวลาทำการหลัก'],+r['รหัสเวลาทำการย่อย'],+r['จำนวนนัดย่อย']||0,is1]}
else{const d=ymd(r['ส่งตรวจ']);if(!d||r.vn==null||r.lct==null)continue;x=[String(r.vn),+r.lct,d];if(k=='appt')x.push(r.dct==null?'':String(r.dct))}out.push(x)}return out}
KINDS.forEach(([k,n])=>{const log=m=>{$('l_'+k).className='log';$('l_'+k).textContent=m},bad=m=>{$('l_'+k).className='log err';$('l_'+k).textContent=m};
$('f_'+k).onchange=e=>{if(k=='sched'&&e.target.files[0])$('t_sched').value=/ไม่ใช่|ไม่ใช้/.test(e.target.files[0].name)?'0':'1'};
$('i_'+k).onclick=async()=>{const fs=[...$('f_'+k).files];if(!fs.length)return bad('กรุณาเลือกไฟล์');$('i_'+k).disabled=true;try{
for(const [fi,f] of fs.entries()){log(`(${fi+1}/${fs.length}) กำลังอ่าน ${f.name} … ไฟล์ใหญ่อาจใช้เวลาหลายนาที`);await new Promise(r=>setTimeout(r,50));
const wb=XLSX.read(await f.arrayBuffer(),{type:'array',dense:true});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{raw:false,dateNF:'yyyy-mm-dd hh:mm:ss',defval:null});
if(!rows.length)throw new Error('ไม่พบข้อมูลในไฟล์');const keys=Object.keys(rows[0]).map(s=>s.trim());const miss=NEED[k].filter(c=>!keys.includes(c));if(miss.length)throw new Error('ไฟล์ไม่ตรงชนิดข้อมูล ขาดคอลัมน์: '+miss.join(', '));
